
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #e0e7ff, #f5f3ff);
      color: #1e293b;
    }

    header {
      background: #4338ca;
      color: white;
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    header h2 { font-size: 22px; }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    #logoutBtn {
      background: white;
      color: #4338ca;
    }

    main {
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
    }

    .welcome { margin-bottom: 28px; }
    .welcome h1 { font-size: 30px; margin-bottom: 10px; }
    .welcome p { color: #64748b; }

    .card {
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 8px 25px #1e293b12;
      margin-bottom: 20px;
    }

    .card h3 { color: #4338ca; margin-bottom: 18px; }
    .info { margin: 14px 0; overflow-wrap: anywhere; }
    .info strong { display: inline-block; min-width: 90px; }
    #status { margin-top: 15px; color: #b91c1c; }

    @media (max-width: 500px) {
      header { padding: 16px; }
      main { margin: 25px auto; }
      .welcome h1 { font-size: 25px; }
    }
  </style>
</head>

<body>
  <header>
    <h2>Student Dashboard</h2>
    <button id="logoutBtn">Logout</button>
  </header>

  <main>
    <section class="welcome">
      <h1 id="welcomeText">Welcome, Student!</h1>
      <p>Your personal student dashboard</p>
    </section>

    <section class="card">
      <h3>My Profile</h3>
      <p class="info"><strong>Name:</strong> <span id="studentName">Loading...</span></p>
      <p class="info"><strong>Email:</strong> <span id="studentEmail">Loading...</span></p>
      <p class="info"><strong>User ID:</strong> <span id="studentUID">Loading...</span></p>
      <p id="status" role="status"></p>
    </section>

    <section class="card">
      <h3>My Dashboard</h3>
      <p>Welcome to your student dashboard!</p>
      <p style="margin-top: 12px;">
        More student features can be added here later.
      </p>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

    import {
      getAuth, onAuthStateChanged, signOut
    } from
      "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    import {
      getFirestore, doc, getDoc
    } from
      "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCMi59qqF2hn5a_lnXQydEHaN-vnx_L3mE",
      authDomain: "my---first-website.firebaseapp.com",
      projectId: "my---first-website",
      storageBucket: "my---first-website.firebasestorage.app",
      messagingSenderId: "461174732461",
      appId: "1:461174732461:web:3fd5a3e03cf569ccf13824",
      measurementId: "G-DJ74RB9LX2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const status = document.getElementById("status");

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.replace("auth.html?mode=login");
        return;
      }

      try {
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);

        const profile = userSnap.exists() ? userSnap.data() : {};
        const name = profile.name || user.displayName || "Student";
        const email = profile.email || user.email || "Not available";

        document.getElementById("welcomeText").textContent =
          `Welcome, ${name}!`;
        document.getElementById("studentName").textContent = name;
        document.getElementById("studentEmail").textContent = email;
        document.getElementById("studentUID").textContent = user.uid;

        status.textContent = "";
      } catch (error) {
        status.textContent =
          "Could not load profile. Please refresh the page.";
        console.error(error);
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      try {
        await signOut(auth);
        window.location.replace("auth.html?mode=login");
      } catch (error) {
        status.textContent = "Logout failed. Please try again.";
      }
    });
  </script>
</body>
</html>
