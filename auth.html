
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .card {
      background: white;
      padding: 28px;
      width: min(340px, calc(100% - 56px));
      border-radius: 14px;
      box-shadow: 0 5px 20px #0002;
    }

    h1 { text-align: center; color: #1d4ed8; }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 7px;
      font-size: 15px;
    }

    input { border: 1px solid #cbd5e1; }

    button {
      border: 0;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    .switch {
      background: transparent;
      color: #2563eb;
    }

    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="heading">Sign Up</h1>

    <form id="authForm">
      <input id="name" type="text" placeholder="Full Name"
             autocomplete="name">
      <input id="email" type="email" placeholder="Email Address"
             autocomplete="email" required>
      <input id="password" type="password" placeholder="Password"
             autocomplete="new-password" minlength="6" required>
      <button id="submitBtn" type="submit">Create Account</button>
    </form>

    <button id="switchBtn" class="switch" type="button">
      Already have an account? Login
    </button>

    <button id="logoutBtn" type="button" hidden>Logout</button>
    <p id="message" role="status"></p>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

    import {
      getAuth, createUserWithEmailAndPassword,
      signInWithEmailAndPassword, signOut, onAuthStateChanged,
      updateProfile
    } from
      "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    import {
      getFirestore, doc, setDoc, serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCMi59qqF2hn5a_lnXQydEHaN-vnx_L3mE",
      authDomain: "my---first-website.firebaseapp.com",
      projectId: "my---first-website",
      storageBucket: "my---first-website.firebasestorage.app",
      messagingSenderId: "461174732461",
      appId: "1:461174732461:web:3fd5a3e03cf569ccf13824",
      measurementId: "G-DJ74RB9LX2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("authForm");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const heading = document.getElementById("heading");
    const submitBtn = document.getElementById("submitBtn");
    const switchBtn = document.getElementById("switchBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const message = document.getElementById("message");

    let mode = new URLSearchParams(location.search).get("mode") === "login"
      ? "login" : "signup";

    function renderMode() {
      const signup = mode === "signup";
      heading.textContent = signup ? "Sign Up" : "Login";
      nameInput.hidden = !signup;
      nameInput.required = signup;
      nameInput.autocomplete = signup ? "name" : "off";
      passwordInput.autocomplete = signup ? "new-password" : "current-password";
      submitBtn.textContent = signup ? "Create Account" : "Login";
      switchBtn.textContent = signup
        ? "Already have an account? Login"
        : "Need an account? Sign Up";
      message.textContent = "";
    }

    switchBtn.addEventListener("click", () => {
      mode = mode === "signup" ? "login" : "signup";
      renderMode();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitBtn.disabled = true;
      message.textContent = "Please wait...";

      try {
        if (mode === "signup") {
          const displayName = nameInput.value.trim();
          const email = emailInput.value.trim();

          const result = await createUserWithEmailAndPassword(
            auth, email, passwordInput.value
          );

          if (displayName) {
            await updateProfile(result.user, { displayName });
          }

          await setDoc(doc(db, "users", result.user.uid), {
            uid: result.user.uid,
            name: displayName,
            email: result.user.email,
            createdAt: serverTimestamp()
          });

          message.textContent = "Account created! Opening dashboard...";
          window.location.replace("dashboard.html");
        } else {
          await signInWithEmailAndPassword(
            auth, emailInput.value.trim(), passwordInput.value
          );

          message.textContent = "Login successful! Opening dashboard...";
          window.location.replace("dashboard.html");
        }
      } catch (error) {
        message.textContent = error.message;
      } finally {
        submitBtn.disabled = false;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      try {
        await signOut(auth);
        message.textContent = "Logged out successfully.";
      } catch (error) {
        message.textContent = error.message;
      }
    });

    onAuthStateChanged(auth, (user) => {
      logoutBtn.hidden = !user;

      if (user && location.pathname.endsWith("auth.html")) {
        window.location.replace("dashboard.html");
      }
    });

    renderMode();
  </script>
</body>
</html>
